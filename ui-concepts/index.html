<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TK 自动化 · UI 方向稿</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background:#eef0f2; color:#17202a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:clamp(24px,5vw,72px); }
    main { max-width:1180px; margin:auto; }
    header { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end; border-bottom:2px solid #17202a; padding-bottom:24px; }
    h1 { margin:0; font:700 clamp(30px,5vw,64px)/.98 Georgia,"Songti SC",serif; letter-spacing:-.04em; }
    header p { max-width:40ch; margin:0; color:#58616b; line-height:1.65; }
    section { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:28px; }
    article { min-height:360px; display:flex; flex-direction:column; padding:24px; background:#fff; border:1px solid #cbd0d5; }
    article:nth-child(1){ border-top:8px solid #e36a2e; }
    article:nth-child(2){ border-top:8px solid #325ad8; }
    article:nth-child(3){ border-top:8px solid #b43d2f; }
    small { font:700 12px/1.2 Consolas,monospace; letter-spacing:.12em; color:#67717b; }
    h2 { margin:52px 0 10px; font-size:25px; }
    p { line-height:1.65; color:#56606a; }
    a { margin-top:auto; min-height:44px; display:inline-flex; align-items:center; justify-content:center; color:#fff; background:#17202a; text-decoration:none; font-weight:700; }
    a:hover { background:#34404c; }
    a:focus-visible { outline:3px solid #e36a2e; outline-offset:3px; }
    @media (max-width:820px){ header,section{grid-template-columns:1fr;} article{min-height:280px;} }
  </style>
</head>
<body>
  <main>
    <header><h1>操作界面<br>三个方向</h1><p>面向跨账户迁移、能力恢复与批量创建。每套均支持浅色 / 深色、窄屏与浏览器缩放。</p></header>
    <section aria-label="设计方向">
      <article><small>DIRECTION A / ROUTE</small><h2>航线台账</h2><p>目标账户像目的港，能力与任务沿迁移航线排列。适合需要持续观察多账户进度的场景。</p><a href="./flight-ledger/">打开方向 A</a></article>
      <article><small>DIRECTION B / SIGNAL</small><h2>信号剖面</h2><p>把凭据、同步、能力和执行拆成一条可诊断的状态脊柱，异常位置一眼可见。</p><a href="./signal-section/">打开方向 B</a></article>
      <article><small>DIRECTION C / ORDER</small><h2>作业票</h2><p>以一张操作单完成选择、参数、核对与执行，适合高频、重复、批量的日常工作。</p><a href="./work-order/">打开方向 C</a></article>
    </section>
  </main>
</body>
</html>
